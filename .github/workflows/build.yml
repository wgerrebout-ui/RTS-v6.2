name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Java installé par GitHub lui-même (Temurin 17). Si jamais cette version posait problème,
      # remplacez simplement '17' par '11' : la compilation fonctionne avec les deux.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv

      - 
      - name: Compiler l'APK
        run: |
          set -e
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "Java utilisé pour la compilation :"
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          buildozer android clean
          buildozer -v android debug 2>&1 | tee build.log

      - name: Résumé de l'erreur (si échec)
        if: failure()
        run: |
          echo "===== LIGNES D'ERREUR ====="
          grep -n -i -E "error|failed|exception|not found|aidl|no such" build.log | tail -n 40 || true
          echo "===== FIN DU JOURNAL ====="
          tail -n 60 build.log

      - name: Journal complet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Envoyer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: rtsmedieval-apk
          path: bin/*.apk
